<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Penilaian Mahasiswa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 450px;
      border: 1px solid #334155;
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #38bdf8;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #94a3b8;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }

    .result-card {
      margin-top: 24px;
      padding: 20px;
      background-color: #0f172a;
      border-radius: 12px;
      border: 1px solid #334155;
      display: none;
    }

    .result-card.active {
      display: block;
    }

    .result-card h3 {
      font-size: 16px;
      color: #38bdf8;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .status-badge {
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .status-lulus {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    .status-gagal {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>DATA MAHASISWA</h2>
    <form id="nilaiForm">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama" required>
      </div>
      <div class="form-group">
        <label for="nim">NIM</label>
        <input type="text" id="nim" placeholder="Masukkan NIM" required>
      </div>
      <div class="form-group">
        <label for="tugas">Nilai Tugas (30%)</label>
        <input type="number" id="tugas" min="0" max="100" step="0.1" placeholder="0 - 100" required>
      </div>
      <div class="form-group">
        <label for="uts">Nilai UTS (30%)</label>
        <input type="number" id="uts" min="0" max="100" step="0.1" placeholder="0 - 100" required>
      </div>
      <div class="form-group">
        <label for="uas">Nilai UAS (40%)</label>
        <input type="number" id="uas" min="0" max="100" step="0.1" placeholder="0 - 100" required>
      </div>
      <button type="submit">Hitung Nilai Akhir</button>
    </form>

    <div class="result-card" id="resultCard">
      <h3>HASIL PENILAIAN</h3>
      <div class="result-item">
        <span>Nama:</span>
        <strong id="resNama">-</strong>
      </div>
      <div class="result-item">
        <span>NIM:</span>
        <strong id="resNim">-</strong>
      </div>
      <div class="result-item">
        <span>Nilai Akhir:</span>
        <strong id="resNilai">-</strong>
      </div>
      <div class="result-item">
        <span>Status:</span>
        <span id="resStatus" class="status-badge">-</span>
      </div>
    </div>
  </div>

  <script>
    function hitungNilaiAkhir(tugas, uts, uas) {
      return (0.3 * tugas) + (0.3 * uts) + (0.4 * uas);
    }

    function tentukanStatus(nilai) {
      return nilai >= 60 ? "LULUS" : "TIDAK LULUS";
    }

    document.getElementById('nilaiForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nama = document.getElementById('nama').value;
      const nim = document.getElementById('nim').value;
      const tugas = parseFloat(document.getElementById('tugas').value);
      const uts = parseFloat(document.getElementById('uts').value);
      const uas = parseFloat(document.getElementById('uas').value);

      const nilaiAkhir = hitungNilaiAkhir(tugas, uts, uas);
      const status = tentukanStatus(nilaiAkhir);

      document.getElementById('resNama').textContent = nama;
      document.getElementById('resNim').textContent = nim;
      document.getElementById('resNilai').textContent = nilaiAkhir.toFixed(2);
      
      const statusElem = document.getElementById('resStatus');
      statusElem.textContent = status;

      if (status === "LULUS") {
        statusElem.className = "status-badge status-lulus";
      } else {
        statusElem.className = "status-badge status-gagal";
      }

      document.getElementById('resultCard').classList.add('active');
    });
  </script>

</body>
</html>
